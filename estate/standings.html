<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rare Fiends — standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Sometype+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="page.css"><!-- the page template, read off economy.html and mapgen.html -->
<style>
/* this page's own pieces; everything else is page.css. Archivo and the page's own grey ink went with the
   template: the page now reads in the house's two fonts and its ink, like economy.html and the map. */
.pot { font-family: var(--display); font-size: 16px; letter-spacing: .08em; color: var(--signal); margin: 0 0 12px; }
.bar { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; flex-wrap: wrap; }
.tabs { display: flex; border: 1px solid var(--faint); }
.tabs button { font-family: var(--display); font-size: 15px; letter-spacing: .08em; color: var(--dim);
  background: none; border: 0; border-right: 1px solid var(--faint); padding: 8px 12px; cursor: pointer; }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-pressed="true"] { background: var(--signal); color: var(--paper); }
.find { flex: 1; min-width: 150px; display: flex; border: 1px solid var(--faint); }
.find input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 18px; color: var(--ink);
  background: transparent; border: 0; padding: 8px 10px; }
.find input::placeholder { color: var(--faint); }
.find input:focus { outline: none; background: rgba(255,255,255,.05); }

.tw { border: 1px solid var(--faint); margin: 0 0 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-family: var(--display); font-weight: 400; font-size: 14px; letter-spacing: .1em; color: var(--dim); background: rgba(255,255,255,.03);
  text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--faint); white-space: nowrap; cursor: pointer; }
th.num, td.num { text-align: right; }
th[data-on="1"] { color: var(--signal); }
td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 18px; }
tr:last-child td { border-bottom: 0; }
tr.row:hover td { background: rgba(255,255,255,.04); }
.rank { font-family: var(--display); font-size: 18px; color: var(--dim); width: 44px; }
.rank.top { color: var(--signal); }
.tok { font-size: 18px; }
.sub { display: block; font-size: 15px; color: var(--dim); margin-top: 2px; }
.sub.bname { color: var(--ink); font-family: var(--display); font-size: 12px; letter-spacing: .08em; }
.addr { display: block; overflow-wrap: anywhere; }     /* a whole address, always shown: it wraps rather than scroll a phone */
.val { font-size: 19px; }
.val.sig { color: var(--signal); }
.pill { font-family: var(--display); font-size: 12px; letter-spacing: .08em; border: 1px solid var(--faint); padding: 3px 6px; white-space: nowrap; }
.pill.on { border-color: var(--signal); color: var(--signal); }
.pill.off { color: var(--dim); border-style: dashed; }
@media (max-width: 720px) {
  td, th { padding-left: 8px; padding-right: 8px; }
  td { font-size: 15px; } .tok, .val { font-size: 15px; } .sub { font-size: 12px; } .rank { width: 32px; font-size: 15px; }
  .hide-s { display: none; }
  .sub { overflow-wrap: anywhere; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i></i>RARE FIENDS<span>· STANDINGS</span></div>
  <button class="pagesbtn" type="button" aria-expanded="false">PAGES</button>
  <nav aria-label="pages">
    <a href="player.html">MY PROFILE</a>
    <a href="base.html">START GAME</a>
    <a href="base.html?open=market">MARKET</a>
    <a href="standings.html">STANDINGS</a>
    <a href="base.html?open=build">BUILD</a>
  </nav>
</header>
<main class="page">
  <h1>STANDINGS</h1>
  <p class="lede">Who is ahead when the era closes: players by crystals banked, Friends by what they earned.</p>
  <p class="pot" id="pot">POT</p>

  <section class="part" aria-label="the table">
    <div class="bar">
      <div class="tabs" id="tabs">
        <button type="button" data-t="players" aria-pressed="true">PLAYERS</button>
        <button type="button" data-t="friends">FRIENDS</button>
      </div>
      <label class="find"><input id="find" type="search" placeholder="find a token #" aria-label="find a token"></label>
    </div>
    <div class="tw">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="note" id="note"></p>
  </section>
</main>
<footer class="credits">
  <a class="mark" href="https://x.com/rarefiends" target="_blank" rel="noopener" aria-label="Rare Fiends on X"><img src="icon-192.png" alt="" width="20" height="20"></a>
  <span class="by">POWERED BY <a href="https://x.com/intelstrata" target="_blank" rel="noopener">@INTELSTRATA</a>
  AND <a href="https://rarefriends.com" target="_blank" rel="noopener"><img src="token.svg" alt="" width="18" height="18"> RAREFRIENDS</a></span>
</footer>
<script src="session.js"></script>
<script>RFSession.nav();</script>
<script src="values.js"></script><!-- the crystal unit: a record counts crystals in hundredths -->
<script>
(async function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const nothing = (why) => {
    $('pot').textContent = 'NO ERA HAS RUN';
    $('find').closest('.bar').hidden = true; $('head').closest('.tw').hidden = true;
    $('note').textContent = why;
  };
  // WHERE THE TABLE COMES FROM. Off a developer's machine it is the server's /api/standings: every base record
  // with an owner, `gathered` in the record's own units, highest first. standings-data.json is a planning file
  // the deploy scripts refuse to publish (it carries owner strings), so it is never asked for there - asking
  // got a 403 on every open. On localhost the sample stays, for working on the page's other columns.
  const LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!LOCAL) {
    let J = null;
    try {
      const r = await fetch('/api/standings', { cache: 'no-store', credentials: 'same-origin' });
      if (r.ok) J = await r.json();
    } catch (_) { J = null; }
    if (!J || !J.ok || !Array.isArray(J.players)) return nothing('The standings could not be read just now. Sign in with a wallet that holds a Genesis, then open this page again.');
    if (!J.players.length) return nothing('Nothing to rank yet. No player has a saved base, so there is nobody to put in order.');
    return live(J);
  }
  function live(J) {
    const UNIT = window.VALUES.crystalUnit;
    const fmt = (n) => (n / UNIT).toFixed(2);            // hundredths to shown, as player.html and the base show them
    const P = J.players.filter(p => p && typeof p.address === 'string')
      .map(p => ({ address: p.address, name: (typeof p.name === 'string' && p.name) ? p.name : null,
        gathered: typeof p.gathered === 'number' ? p.gathered : 0,
        baseName: (typeof p.baseName === 'string' && p.baseName) ? p.baseName : null }))
      .sort((a, b) => b.gathered - a.gathered);
    let q = '';
    const at = new Date(J.at);
    // No pot: no era has closed, and the server reports none.
    $('pot').textContent = 'NO ERA HAS RUN · ' + P.length + (P.length === 1 ? ' PLAYER' : ' PLAYERS');
    $('tabs').hidden = true;                               // the server ranks players only; Friends have no standings to read yet
    $('find').placeholder = 'find a name, base or address'; $('find').setAttribute('aria-label', 'find a player');
    $('head').innerHTML = '<tr><th style="cursor:default">#</th><th style="cursor:default">PLAYER</th>' +
      '<th class="num" style="cursor:default" data-on="1">GATHERED</th><th class="hide-s" style="cursor:default">TEAM UP</th></tr>';
    function render() {
      const body = $('rows'); body.innerHTML = '';
      const needle = q.toLowerCase();
      P.forEach((p, i) => {
        if (needle && !(p.address.toLowerCase().includes(needle) || (p.name || '').toLowerCase().includes(needle) || (p.baseName || '').toLowerCase().includes(needle))) return;
        const place = i + 1;                               // filtering does not change a player's place
        const tr = document.createElement('tr'); tr.className = 'row';
        // WHO A PLAYER IS: the name they choose, and the address always beside it - never one without the other.
        const who = p.name
          ? '<span class="tok">' + esc(p.name) + '</span><span class="sub addr">' + esc(p.address) + '</span>'
          : '<span class="tok addr">' + esc(p.address) + '</span><span class="sub">no name chosen</span>';
        // the home base's own name, set on MY PROFILE by whoever holds its Genesis
        const home = p.baseName ? '<span class="sub bname">BASE · ' + esc(p.baseName) + '</span>' : '';
        tr.innerHTML = '<td class="rank' + (place <= 3 ? ' top' : '') + '">' + place + '</td>' +
          '<td>' + who + home + '</td>' +
          '<td class="num"><span class="val sig">' + fmt(p.gathered) + '</span><span class="sub">crystals</span></td>' +
          '<td class="hide-s"><span class="pill off">NOT RECORDED</span></td>';
        body.appendChild(tr);
      });
      $('note').textContent = 'Ranked by crystals gathered so far, read from each player\'s saved base' +
        (isNaN(at) ? '' : ' at ' + at.toLocaleString()) + '. When an era closes, standing is crystals banked; no era has closed, so this is the running count. ' +
        'A name shows beside the address once a player chooses one; the address is always shown. ' +
        'No partnership is recorded anywhere yet, so the TEAM UP column has nothing to show.';
    }
    $('find').addEventListener('input', (e) => { q = e.target.value.trim(); render(); });
    render();
  }

  // LOCALHOST: the sample table, for development.
  let D;
  try { const r = await fetch('standings-data.json?v=' + Date.now()); if (!r.ok) throw new Error(String(r.status)); D = await r.json(); }
  catch (_) {
    return nothing('Nothing to rank yet. Standings are crystals banked when an era closes, and no era has closed.');
  }
  let tab = 'players', sort = 'banked', dir = -1, q = '';
  // No generation title: it was invented and nothing on chain said it. The Friend row already prints
  // the generation, and `standings-data.json` carries no family, so nothing takes its place.
  $('pot').textContent = 'POT ' + D.pot.toLocaleString() + ' RF · closes ' + D.closes;

  const COLS = {
    players: [
      { k: 'rank', t: '#' }, { k: 'token', t: 'GENESIS' },
      { k: 'banked', t: 'BANKED', num: true },
      // TEAM UP (ruling 38): partnerships replace hiring. Nothing records a partnership yet - RarePartners is
      // not deployed and standings-data.json carries none - so the column says so rather than show a number.
      { k: 'land', t: 'LAND', num: true, hide: true }, { k: 'team', t: 'TEAM UP', hide: true, fixed: true },
    ],
    friends: [
      { k: 'rank', t: '#' }, { k: 'token', t: 'FRIEND' },
      { k: 'earned', t: 'EARNED', num: true },
      { k: 'status', t: 'STATUS' }, { k: 'served', t: 'SERVED', num: true, hide: true },
    ],
  };
  function rows() {
    const list = (tab === 'players' ? D.players : D.friends).slice();
    const key = sort === 'rank' ? (tab === 'players' ? 'banked' : 'earned') : sort;
    list.sort((a, b) => (typeof a[key] === 'string')
      ? String(a[key]).localeCompare(String(b[key])) * dir
      : ((a[key] || 0) - (b[key] || 0)) * dir);
    return q ? list.filter(r => String(r.token).includes(q)) : list;
  }
  function render() {
    $('head').innerHTML = '<tr>' + COLS[tab].map(c =>
      '<th class="' + (c.num ? 'num ' : '') + (c.hide ? 'hide-s' : '') + '" data-k="' + c.k + '"' + (c.fixed ? ' style="cursor:default"' : '') +
      (sort === c.k ? ' data-on="1"' : '') + '>' + c.t + '</th>').join('') + '</tr>';
    $('head').querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (k === 'rank' || COLS[tab].find(c => c.k === k).fixed) return;   // TEAM UP has nothing to sort by
      if (sort === k) dir = -dir; else { sort = k; dir = -1; }
      render();
    }));
    const body = $('rows'); body.innerHTML = '';
    rows().forEach((r, i) => {
      const tr = document.createElement('tr'); tr.className = 'row';
      const place = i + 1;
      const cells = tab === 'players' ? [
        '<td class="rank' + (place <= 3 ? ' top' : '') + '">' + place + '</td>',
        '<td><span class="tok">Genesis #' + r.token + '</span><span class="sub">' + r.owner +
          ' · ' + r.n + ' genesis · ' + r.plan + '</span></td>',
        '<td class="num"><span class="val sig">' + r.banked.toLocaleString() + '</span><span class="sub">crystals</span></td>',
        '<td class="num hide-s"><span class="val">' + r.land + '</span><span class="sub">tiles</span></td>',
        // no partnership is recorded anywhere yet, so nothing is shown as one - not even "none"
        '<td class="hide-s"><span class="pill off">NOT RECORDED</span></td>',
      ] : [
        '<td class="rank' + (place <= 3 ? ' top' : '') + '">' + place + '</td>',
        '<td><span class="tok">Friend #' + r.token + '</span><span class="sub">Gen ' + r.gen + '</span></td>',
        '<td class="num"><span class="val sig">' + r.earned + '</span><span class="sub">RF earned</span></td>',
        // 'hired' is hiring's status, and hiring is removed (M16 item 8): the sample still carries it, the page does not show it
        r.status === 'hired' ? '<td><span class="sub">—</span></td>' :
        '<td><span class="pill ' + (r.status === 'dormant' ? 'off' : r.status === 'free' ? '' : 'on') + '">' + r.status.toUpperCase() + '</span></td>',
        '<td class="num hide-s"><span class="val">' + r.served + '</span><span class="sub">tourneys</span></td>',
      ];
      tr.innerHTML = cells.join('');
      body.appendChild(tr);
    });
    $('note').textContent = tab === 'players'
      ? 'Standing is crystals banked when the era closes. Land and Genesis counts are read from the chain; era figures are illustrative until an era runs. ' +
        'TEAM UP: two players can partner and share what each earns from then on, at a split they agree between them. Genesis teams up with Genesis, Generation with Generation, one partnership at a time at launch, and each keeps the controls of their own base. ' +
        'No partnership is recorded anywhere yet - nothing in the game or on chain holds one - so the TEAM UP column has nothing to show.'
      : 'Each Friend shows its generation, what it has earned, and where it is now. Dormant Friends must be woken before they can serve. Figures are illustrative until an era runs. ' +
        'Hiring is gone - partnerships replace it - so a Friend shows no wage, no share and no hired status.';
  }
  $('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    tab = b.dataset.t; sort = tab === 'players' ? 'banked' : 'earned'; dir = -1;
    $('tabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  $('find').addEventListener('input', (e) => { q = e.target.value.trim(); render(); });
  render();
})();
</script>
</body>
</html>
