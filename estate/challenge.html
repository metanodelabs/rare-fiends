    function pay(k, n) { P[k][U.purse] -= n; S[U.pot] += n; S.paid[U.id][k] += n; renderPlayer(k); paintPot(); }
    function paintH(msg, cls, hi) {
      const n = STREETS[at][1], up = over && !folded, b = betN();
      const acts = due
        ? '<button class="go" type="button" id="hcall">CALL ' + due + '</button>' +
          (canRaise() ? '<button class="go alt" type="button" id="hraise">RAISE ' + (due + b) + '</button>' : '')
        : '<button class="go" type="button" id="hcheck">' + 'CHECK' + '</button>' +
          (cover(b) ? '<button class="go alt" type="button" id="hbet">BET ' + b + '</button>' : '');
      arena.innerHTML =
        '<div class="seats">' +
          '<div class="street"><span class="cap">' + TABLE[at] + '</span><div class="cards">' +
            (n ? handHTML(board.slice(0, n), hi) : handHTML([null, null, null])) + '</div></div>' +
          '<div class="pair">' +
          '<div class="seat"><span class="cap' + (up ? ' locked' : '') + '">' + who(them()) +
            (up ? '' : ' · FACE DOWN') + '</span>' +
            '<div class="cards">' + (up ? handHTML(theirs, hi) : handHTML([null, null])) + '</div>' +
            '<span class="cap" id="htname">' + (up ? bestOf(theirs.concat(board)).name : '') + '</span></div>' +
          '<div class="seat"><span class="cap locked">' + who(me()) + ' · YOU</span>' +
            '<div class="cards">' + handHTML(mine, hi) + '</div>' +
            '<span class="cap" id="hmname">' + (n >= 3 ? bestOf(mine.concat(board.slice(0, n))).name : '') + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="unit"><span class="k">BETS IN' + (S.stake ? '' : ' · NOTHING TO BET · DEMO MODE') + '</span><span class="seg">' +
          BET_UNITS.map(u => '<button class="ghost" type="button" data-unit="' + u.id + '" aria-pressed="' + (u === U) + '"' +
            (u.on ? '' : ' disabled title="' + u.off + '"') + '>' + u.name + (u.on ? '' : ' · ' + u.off) + '</button>').join('') + '</span></div>' +
        (over ? '' : '<div class="acts2">' + acts + '<button class="go alt" type="button" id="hfold">FOLD</button></div>') +
        '<div class="result' + (cls || '') + '" id="hres">' + (msg || '') + '</div>';
      if (busy) arena.querySelectorAll('.acts2 .go').forEach(x => { x.disabled = true; });
      if ($('hcheck')) $('hcheck').onclick = check;
      if ($('hbet')) $('hbet').onclick = bet;
      if ($('hcall')) $('hcall').onclick = call;
      if ($('hraise')) $('hraise').onclick = raise;
      if ($('hfold')) $('hfold').onclick = fold;
    }
    // how good their hand looks to them: the category of the best hand on the cards showing, or before the
    // flop the hole cards alone - a pair, two high cards, or not much. One number in 0..1 and nothing else.
    function strength() {
      const n = STREETS[at][1];
      if (!n) { const r = theirs.map(c => { const x = rankIx(c); return x === 0 ? 14 : x + 1; });
        return r[0] === r[1] ? 0.7 + r[0] / 50 : Math.min(r[0], r[1]) >= 10 ? 0.55 : 0.25 + Math.max(r[0], r[1]) / 70; }
      return [0.2, 0.45, 0.6, 0.75, 0.85, 0.9, 0.95, 1, 1][bestOf(theirs.concat(board.slice(0, n))).score[0]];
    }
    // the page's turn. `facing` is the bet it has to answer, 0 when it was checked to.
    async function theirTurn(facing) {
      busy = true; paintH($('hres') ? $('hres').innerHTML : '');
      const s = strength(), r = below(100) / 100, street = STREETS[at][0].toLowerCase();
      await wait(700);
      if (facing) {
        if (s < 0.4 && r < 0.65) { over = true; folded = them(); busy = false; log(them(), 'fold');
          paintH(who(them()) + ' FOLDS <span class="need">· THE POT IS YOURS</span>', ' win');
          say('<b>' + who(them()) + '</b> folds at ' + street + '. The pot of <b>' + S.pot + '</b> is yours.');
          await wait(900); done(me()); return; }
        if (s >= 0.7 && r < 0.6 && raises < HOLDEM.raises && cover(facing + betN())) {
          pay(them(), facing + betN()); due = betN(); raises++; busy = false; log(them(), 'raise', facing + betN());
          paintH(who(them()) + ' RAISES ' + (facing + betN()) + ' <span class="need">· ' + due + ' TO YOU</span>');
          say('<b>' + who(them()) + '</b> calls your ' + facing + ' and raises ' + betN() + '. <b>' + due + '</b> to you: call, raise or fold.'); return; }
        pay(them(), facing); log(them(), 'call', facing);
        paintH(who(them()) + ' CALLS ' + facing); say('<b>' + who(them()) + '</b> calls ' + facing + '.');
        await wait(600); next(); return;                  // busy stays up until the new street is drawn
      }
      if (s >= 0.6 && r < 0.7 && cover(betN())) {
        pay(them(), betN()); due = betN(); busy = false; log(them(), 'bet', due);
        paintH(who(them()) + ' BETS ' + due + ' <span class="need">· ' + due + ' TO YOU</span>');
        say('<b>' + who(them()) + '</b> bets <b>' + due + '</b>. Call, raise or fold.'); return; }
      log(them(), 'check');
      if (first === them()) { busy = false; paintH(who(them()) + ' CHECKS <span class="need">· TO YOU</span>');
        say('<b>' + who(them()) + '</b> checks. ' + (cover(betN()) ? 'Check, bet or fold.' : 'Check or fold.')); return; }
      paintH(who(them()) + ' CHECKS'); say('<b>' + who(them()) + '</b> checks.');
      await wait(500); next();
    }
    function check() { if (over || busy || due) return; log(me(), 'check');
      if (first === me()) theirTurn(0); else { busy = true; paintH('YOU CHECK'); say('You check.'); setTimeout(next, 500); } }
    function bet() { if (over || busy || due || !cover(betN())) return; const n = betN(); pay(me(), n); raises = 0; log(me(), 'bet', n);
      paintH('YOU BET ' + n); say('You bet <b>' + n + '</b>.'); theirTurn(n); }
    function call() { if (over || busy || !due) return; const n = due; pay(me(), n); due = 0; busy = true; log(me(), 'call', n);
      paintH('YOU CALL ' + n); say('You call <b>' + n + '</b>.'); setTimeout(next, 500); }
    function raise() { if (over || busy || !due || !canRaise()) return; const n = due + betN(); pay(me(), n); raises++; due = 0; log(me(), 'raise', n);
      paintH('YOU RAISE ' + n); say('You call and raise: <b>' + n + '</b> in.'); theirTurn(betN()); }
    // the bets are matched: the next street, or the showdown after the river
    async function next() {
      if (over) return;
      due = 0; raises = 0; busy = false;
      if (at < 3) { at++;
        const n = STREETS[at][1], mb = bestOf(mine.concat(board.slice(0, n)));
        paintH(STREETS[at][0] + ' · YOU HAVE ' + mb.name);
        if (first === them()) { say(STREETS[at][0].toLowerCase() + ': you have <b>' + mb.name.toLowerCase() + '</b>. <b>' + who(them()) + '</b> acts first.');
          theirTurn(0); return; }
        say(STREETS[at][0].toLowerCase() + ': you have <b>' + mb.name.toLowerCase() + '</b>. ' + (cover(betN()) ? 'Check, bet or fold.' : 'Check or fold.'));
        return; }
      over = true;
      const m = bestOf(mine.concat(board)), t = bestOf(theirs.concat(board)), d = cmpScore(m.score, t.score);
      const res = d === 0 ? 'draw' : d > 0 ? me() : them();
      paintH((res === 'draw' ? 'A SPLIT POT' : res === me() ? 'YOU WIN' : 'YOU LOSE') +
        ' <span class="need">· ' + m.name + ' V ' + t.name + '</span>', res === me() ? ' win' : '', (d >= 0 ? m : t).cards);
      say(res === 'draw' ? 'The same hand both ways: <b>' + m.name.toLowerCase() + '</b>. The pot is split.'
        : '<b>' + (res === me() ? m.name.toLowerCase() : t.name.toLowerCase()) + '</b> takes the pot of <b>' + S.pot + '</b>.');
      await wait(900);
      done(res);
    }
    async function fold() {
      if (over || busy) return;
      over = true; folded = me(); log(me(), 'fold');
      paintH('YOU FOLDED <span class="need">· THE POT GOES ACROSS</span>');
      say('You folded at <b>' + STREETS[at][0].toLowerCase() + '</b>. The pot of <b>' + S.pot + '</b> goes to <b>' + who(them()) + '</b>.');
      await wait(900);
      done(them());
    }
    paintH('HOLE CARDS · ' + (first === me() ? 'YOU ACT FIRST' : who(them()) + ' ACTS FIRST'));
    if (first === them()) { say('Two cards each, five to come in the middle. The stake is the ante. Hand ' + S.hands + ': <b>' + who(them()) + '</b> acts first on every street this hand, you next hand.');
      theirTurn(0); return; }
    say('Two cards each, five to come in the middle. The stake is the ante; hand ' + S.hands + ', and you act first on every street — <b>CHECK</b>, <b>BET</b> or <b>FOLD</b>.');
  }

  /* ---------- the glitching terminal ----------
     A PORT of `mapgen.html`'s ruins layer, not a second commission: the same `sprites/terminal.svg`
     the map draws, the same signal-coloured ghost knocked sideways by whole art-pixels, the same five
     bands knocked about, in the same bursts, off for anyone who asks for reduced motion. It is
     deliberately a DIFFERENT glitch from the title's and from `glitchArt` above, which is the NFT's. */
  let termRaf = 0, termImg = null;
  function stopTerminal() { cancelAnimationFrame(termRaf); termRaf = 0; }
  function terminalGlitch(cv) {
    stopTerminal();
    const px = 96, step = Math.max(1, Math.round(px / 24));         // one of the art's own pixels at this size
    cv.width = px; cv.height = px;
    const c = cv.getContext('2d');
    if (!termImg) { termImg = new Image(); termImg.src = 'sprites/terminal.svg'; }
    let face = null, ghost = null;
    let next = performance.now() + Math.random() * 800, until = 0;
    const draw = (t) => {
      if (!cv.isConnected) { stopTerminal(); return; }
      termRaf = requestAnimationFrame(draw);
      c.imageSmoothingEnabled = false;
      c.fillStyle = '#000'; c.fillRect(0, 0, px, px);
      if (!face) {
        if (!termImg.complete || !termImg.naturalWidth) return;
        face = document.createElement('canvas'); face.width = face.height = px;
        face.getContext('2d').drawImage(termImg, 0, 0, px, px);
        ghost = document.createElement('canvas'); ghost.width = ghost.height = px;
        const g = ghost.getContext('2d'); g.drawImage(face, 0, 0);
        g.globalCompositeOperation = 'source-in'; g.fillStyle = '#CCFF00'; g.fillRect(0, 0, px, px);
      }
      if (!CALM && t > next) { until = t + 120 + Math.random() * 260; next = t + 300 + Math.random() * 900; }
      if (!(!CALM && t < until)) { c.drawImage(face, 0, 0); return; }
      c.drawImage(ghost, (Math.random() < 0.5 ? -2 : 2) * step, 0);
      const bands = 5, bh = Math.ceil(px / bands);
      for (let b = 0; b < bands; b++) { const dx = Math.random() < 0.55 ? Math.round((Math.random() - 0.5) * 6) * step : 0;
        c.drawImage(face, 0, b * bh, px, Math.min(bh, px - b * bh), dx, b * bh, px, Math.min(bh, px - b * bh)); }
    };
    termRaf = requestAnimationFrame(draw);
  }

  /* ---------- Friend or Fiend: the hidden-things game ----------
     Battleship's shape with the name doing the work: each side hides Friends and fiends on its own
     ground, you probe theirs, and what you turn up is one or the other. Find all of their Friends
     first and the pot is yours. A Friend keeps the turn; a fiend or bare ground hands it over.
     THE BOARD IS A GAMEPLAY SHAPE, NOT A NUMBER ANYBODY OWNS. DESIGN.md sets no size and no counts,
     so they live in this one object and change in one line — nothing reads them twice. No odds, no
     stake and no payout is invented here: this game pays through the same pot every other game pays
     through, and `settle` is untouched. */
  function playFoF(arena, done) {
    const word = Chance.randomWord(), duelId = ++S.duels, below = rolls(word, duelId);
    S.last = { duelId, word };
    const theirs = fofGround(below), mine = fofGround(below);       // their ground first, then yours
    const seen = new Array(theirs.length).fill(false), theySeen = new Array(mine.length).fill(false);
    let found = 0, lost = 0, over = false, mine2move = true, note = '', noteCls = '';
    const mark = (k) => k === 'friend' ? 'F' : k === 'fiend' ? 'X' : '·';
    function paintFoF() {
      arena.innerHTML =
        '<div class="fof">' +
          '<span class="lbl">GENESIS #' + P[them()].id + '’S GROUND · ' + FOF.w + '×' + FOF.h + '</span>' +
          '<div class="gridn" style="grid-template-columns:repeat(' + FOF.w + ',minmax(0,1fr))">' +
            theirs.map((k, i) => '<button class="cell' + (seen[i] ? ' ' + k : '') + '" type="button" data-cell="' + i + '"' +
              (seen[i] || over || !mine2move ? ' disabled' : '') + '>' + (seen[i] ? mark(k) : '') + '</button>').join('') +
          '</div>' +
          '<div class="tally">' +
            '<div><span class="k">THEIR FRIENDS</span><span class="v"><b>' + found + '</b> / ' + FOF.friends + '</span></div>' +
            '<div><span class="k">YOURS FOUND</span><span class="v"><b>' + lost + '</b> / ' + FOF.friends + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="result' + noteCls + '" id="fofres">' + note + '</div>';
      arena.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => probe(+b.dataset.cell));
    }
    async function finish(res) {
      over = true;
      note = res === 'draw' ? 'A DRAW · NOTHING LEFT TO PROBE'
        : res === me() ? 'YOU WIN · ALL ' + FOF.friends + ' OF THEIRS FOUND'
        : 'YOU LOSE · THEY FOUND ALL ' + FOF.friends + ' OF YOURS';
      noteCls = res === me() ? ' win' : '';
      paintFoF();
      say(res === 'draw' ? 'Nothing left to probe on either side: a draw.'
        : res === me() ? 'All <b>' + FOF.friends + '</b> of their Friends found. The pot is yours.'
        : 'They found all <b>' + FOF.friends + '</b> of yours first.');
      await wait(900);
      done(res);
    }
    async function probe(i) {
      if (over || seen[i] || !mine2move) return;
      seen[i] = true;
      const k = theirs[i];
      if (k === 'friend') { found++; note = 'A FRIEND · ' + found + ' OF ' + FOF.friends; }
      else note = k === 'fiend' ? 'A FIEND · IT BITES, AND THE TURN GOES OVER' : 'BARE GROUND · THE TURN GOES OVER';
      if (found >= FOF.friends) { await finish(me()); return; }
      if (k === 'friend') { paintFoF(); say('A Friend. Keep going — <b>' + (FOF.friends - found) + '</b> of theirs left.'); return; }
      mine2move = false; paintFoF();
      say((k === 'fiend' ? 'A fiend bites. ' : 'Bare ground. ') + '<b>GENESIS #' + P[them()].id + '</b> probes yours.');
      await wait(850);
      await theirTurn();
    }
    async function theirTurn() {
      for (;;) {
        if (over) return;
        const open = mine.map((_, i) => i).filter(i => !theySeen[i]);
        if (!open.length) { await finish('draw'); return; }
        const i = open[below(open.length)], k = mine[i];
        theySeen[i] = true;
        if (k === 'friend') {
          lost++; note = 'THEY FOUND ONE OF YOURS · ' + lost + ' OF ' + FOF.friends;
          paintFoF(); say('They turned up one of your Friends: <b>' + lost + '</b> of <b>' + FOF.friends + '</b>.');
          if (lost >= FOF.friends) { await finish(them()); return; }
          await wait(850); continue;                                // a Friend keeps their turn too
        }
        note = k === 'fiend' ? 'THEY HIT A FIEND · YOUR TURN' : 'THEY FOUND NOTHING · YOUR TURN';
        mine2move = true; paintFoF();
        say(k === 'fiend' ? 'They hit one of your fiends. Your turn.' : 'They found bare ground. Your turn.');
        return;
      }
    }
    // reached THROUGH a glitching terminal, which is what a terminal is for
    arena.innerHTML =
      '<div class="term"><canvas id="fofterm" aria-label="a terminal, glitching"></canvas>' +
        '<span class="cap">A <b>TERMINAL</b> IN THE RUINS, GLITCHING HARD.<br>THIS IS WHERE FRIEND OR FIEND IS PLAYED.</span>' +
        '<div class="acts2"><button class="go" type="button" id="fofuse">USE THE TERMINAL</button></div>' +
      '</div>' +
      '<div class="result" id="fofres"></div>';
    terminalGlitch($('fofterm'));
    say('The machine is glitching. <b>USE THE TERMINAL</b> to open Friend or Fiend.');
    $('fofuse').onclick = () => { stopTerminal(); paintFoF();
      say('Probe their ground. A <b>Friend</b> keeps your turn; a <b>fiend</b> or bare ground hands it over.'); };
  }

  /* ---------- a duel sprung by a terminal ----------
     DECIDED, and the reason this card exists: a duel sprung by a terminal CANNOT BE DECLINED. The
     challenge screen answers NOT WORTH MY TIME when one player challenges another and it keeps doing
     that — but an ambush is not an invitation. You used the machine; the machine has you. So the page
     has to know which of the two it is showing, and this one carries ONE button.
     What is deliberately NOT here: how much better the Doopie's odds are and what it risks. That is
     one of four open questions on the sprung trap and every one of them is the deployer's, so the card
     SAYS the edge is unset rather than showing a number nobody chose. It does not set the game either:
     which game a planted terminal opens is the collision M17 item 7 exists to settle. */
  function renderSprung() {
    const you = P[me()], g = gameOf(), pot = S.stake * 2;
    $('prompt').className = 'card sprung';
    $('prompt').innerHTML =
      '<div class="mtop cold"><i class="dot"></i><span id="ptitle">SPRUNG · A DUEL YOU CANNOT DECLINE</span>' +
        '<span class="sp"></span><span class="sample">SAMPLE RECORDS</span></div>' +
      '<div class="pc">' +
        '<div class="sprungart"><img id="sprungclip" alt="a Doopie taking the shape of a terminal"></div>' +
        '<div class="pcmain">' +
          '<div class="pcwho"><b>IT WAS NOT A MACHINE</b></div>' +
          '<div class="pcline">A <b>1/1 DOOPIE</b> was standing as a terminal. You used it; it has you.</div>' +
          '<div class="pcbig"><span class="n" id="bign">' + pot + '</span><span class="u">CRYSTALS<br>IN THE POT</span></div>' +
          '<div class="pcline">' + g.name.toLowerCase() + (DEMO.on ? ' · <b>demo mode</b> · free · nothing is staked' : ' · you stake <b>' + S.stake + '</b> of your <b>' + you.purse + '</b>') + '</div>' +
          mostHTML(g) +
          '<span class="sample">THE DOOPIE’S EDGE, AND WHAT IT RISKS · NOT SET · THE DEPLOYER’S</span>' +
        '</div>' +
        '<div class="acts"><button class="go" type="button" id="paccept">THE MACHINE HAS YOU · PLAY IT OUT</button></div>' +
      '</div>';
    $('sprungclip').src = 'burrow/terminal-6289.gif';   // the disguise clip that already exists, not a new one
    $('paccept').onclick = () => { S.screen = 'main'; render(); startStakes(); };

  /* ---------- the algorithm, to test: the same rules and roll as RareDuel.sol ---------- */
  function openAlgo() {
    const c = $('algo'), picks = Duel.PICKS;
    const A = { p1: 'rock', p2: 'scissors', word: (S.last && S.last.word) || Chance.randomWord(), id: (S.last && S.last.duelId) || 1 };
    const pill = (k, v) => '<button class="ghost" type="button" data-ap="' + k + ':' + v + '"' + (A[k] === v ? ' aria-pressed="true"' : '') + '>' + v.toUpperCase() + '</button>';
    const draw = () => {
      const ctx = { word: A.word, contract: Chance.PREVIEW_CONTRACT, chainId: Chance.CHAIN_ID };
      let one; try { one = Duel.settle(ctx, A.id, A.p1, A.p2, S.stake); } catch (e) { one = null; }
      c.innerHTML = '<div class="mtop"><i class="dot"></i><span id="atitle">THE ALGORITHM</span><span class="sp"></span><button class="ghost" type="button" id="aclose">CLOSE</button></div>' +
        '<div class="algo">' +
        '<p class="a-lede">The rules RareDuel.sol runs on chain, with the FriendSDK\'s chance roll. The same word always gives the same result, here and on chain.</p>' +
        '<div class="a-row"><span class="k">CHALLENGER</span><span class="seg">' + picks.map(v => pill('p1', v)).join('') + '</span></div>' +
        '<div class="a-row"><span class="k">CHALLENGED</span><span class="seg">' + picks.map(v => pill('p2', v)).join('') + '</span></div>' +
        '<div class="a-row"><span class="k">ENTROPY WORD</span><input id="aword" spellcheck="false" value="' + A.word + '"><button class="ghost" type="button" id="anew">NEW</button></div>' +
        '<div class="a-row"><span class="k">DUEL ID</span><input id="aid" type="number" min="1" value="' + A.id + '" style="width:80px"></div>' +
        (one ? '<pre class="a-math">odds   the challenger wins ' + one.odds + ' in 10000  (' + (A.p1 === A.p2 ? 'the same pick' : Duel.beats(A.p1, A.p2) ? A.p1 + ' beats ' + A.p2 : A.p2 + ' beats ' + A.p1) + ')\n' +
          'roll   keccak256(abi.encode(word, contract, ' + Chance.CHAIN_ID + ', ' + A.id + ', 0)) % 10000 = <b>' + one.roll + '</b>\n' +
          'result ' + one.roll + (one.winner === 'p1' ? ' < ' : ' ≥ ') + one.odds + '  →  <b>' + (one.winner === 'p1' ? 'THE CHALLENGER' : 'THE CHALLENGED') + ' WINS</b> ' + one.payout + '</pre>'
          : '<pre class="a-math">That word isn\'t a 32-byte hex number.</pre>') +
        '<div class="a-row"><button class="go" type="button" id="arun">RUN 2,000 DUELS FOR EVERY PAIR OF PICKS</button></div><div id="agrid"></div>' +
        '</div>';
      c.querySelectorAll('[data-ap]').forEach(b => b.onclick = () => { const [k, v] = b.dataset.ap.split(':'); A[k] = v; draw(); });
      $('aword').onchange = () => { A.word = $('aword').value.trim(); draw(); };
      $('aid').onchange = () => { A.id = Math.max(1, parseInt($('aid').value, 10) || 1); draw(); };
      $('anew').onclick = () => { A.word = Chance.randomWord(); draw(); };
      $('aclose').onclick = closeAlgo;
      $('arun').onclick = () => {
        $('arun').disabled = true; $('arun').textContent = 'RUNNING…';
        setTimeout(() => {
          const N = 2000, ctx = { contract: Chance.PREVIEW_CONTRACT, chainId: Chance.CHAIN_ID };
          let html = '<table class="a-grid"><tr><th>challenger ↓ · challenged →</th>' + picks.map(v => '<th>' + v.toUpperCase() + '</th>').join('') + '</tr>';
          picks.forEach(a => { html += '<tr><th>' + a.toUpperCase() + '</th>'; picks.forEach(b => {
            let w = 0; for (let k = 0; k < N; k++) if (Duel.settle(Object.assign({ word: Chance.randomWord() }, ctx), k + 1, a, b, 1).winner === 'p1') w++;
            html += '<td><b>' + (w / N * 100).toFixed(1) + '%</b><span>odds ' + Duel.oddsBps(a, b) / 100 + '%</span></td>'; }); html += '</tr>'; });
          $('agrid').innerHTML = html + '</table><p class="a-lede">How often the challenger won, out of ' + N.toLocaleString('en-US') + ' fresh words a cell, against the odds the picks set.</p>';
          $('arun').textContent = 'RUN AGAIN'; $('arun').disabled = false;
        }, 30);
      };
    };
    draw(); c.hidden = false; ['main', 'prompt', 'nope'].forEach(k => { $(k).hidden = true; });
  }
  // back to whatever was on screen, as it was (a game in play keeps its hands)
  function closeAlgo() { $('algo').hidden = true; ['main', 'prompt', 'nope'].forEach(k => { $(k).hidden = S.screen !== k; }); }

  /* ---------- wiring ---------- */
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; restart(); });
  document.querySelectorAll('[data-answer]').forEach(b => b.onclick = () => { S.answer = b.dataset.answer; render(); });
  $('algoBtn').onclick = openAlgo;
  $('xclose').onclick = () => { if (EMBED) leave(); else location.href = 'base.html'; };
  $('reset').onclick = () => { const o = JSON.parse(START); Object.assign(P, o.P); Object.assign(H2H, o.H2H); Object.assign(POTS, o.POTS);
    restart(); };
  // ?as=challenged opens on the incoming prompt; ?answer=decline makes the other side say no
  const q = new URLSearchParams(location.search);
  if (q.get('as') === 'challenged') S.view = 'defender';
  if (q.get('answer') === 'decline') S.answer = 'decline';

          '<span class="vs">VS</span><div class="hand theirs"><canvas id="rht"></canvas><span class="cap' + (v.picks[them2] ? ' locked' : '') + '" id="rtheirs">' + short(themAddr) + ' · ' +
          (over ? v.picks[them2].toUpperCase() : v.picks[them2] ? 'SEALED' : 'THINKING') + '</span></div></div>' +
          (v.legal.length ? '<div class="picks">' + v.legal.map(p => '<button class="pick" type="button" data-act=\'' + JSON.stringify({ type: 'pick', pick: p }) + '\'><canvas data-hand="' + p + '"></canvas><span>' + p.toUpperCase() + '</span></button>').join('') + '</div>' : '') +
          (over ? '<div class="result' + (res === mine ? ' win' : '') + '" id="tres">' + verdict + ' <span class="need">· ROLL ' + String(v.roll).padStart(4, '0') + ' · ' + (mine === 'p1' ? 'YOUR' : 'THEIR') + ' ODDS ' + v.odds / 100 + '%</span></div>' : '');
      } else if (v.game === 'blackjack') {
        arena = '<div class="seats"><div class="pair"><div class="seat"><span class="cap">' + short(themAddr) + (v.theyStood ? ' · STOOD' : '') + '</span><div class="cards">' + handHTML(v.theirs) + '</div>' +
          '<span class="tot">' + (v.theirTotal == null ? '?' : v.theirTotal) + '</span></div>' +
          '<div class="seat"><span class="cap locked">YOU' + (v.stood ? ' · STOOD' : '') + '</span><div class="cards">' + handHTML(v.mine) + '</div><span class="tot' + (v.total > 21 ? ' bust' : '') + '" id="bjt">' + v.total + '</span></div></div></div>' +
          (v.legal.length ? '<div class="acts2">' + btn({ type: 'hit' }, 'HIT') + btn({ type: 'stand' }, 'STAND', 1) + '</div>' : '') +
          (over ? '<div class="result' + (res === mine ? ' win' : '') + '" id="tres">' + verdict + '</div>' : '');
      } else if (v.game === 'holdem') {
        const L = { check: 'CHECK', bet: 'BET ' + v.bet, call: 'CALL ' + v.due, raise: 'RAISE ' + (v.due + v.bet), fold: 'FOLD' };
        arena = '<div class="seats"><div class="street"><span class="cap">' + ['HOLE CARDS', 'THE FLOP', 'THE TURN', 'THE RIVER'][v.street] + (over ? ' · SHOWDOWN' : '') + '</span><div class="cards" id="hboard">' +
            (v.board.length ? handHTML(v.board, v.best && v.best.cards) : handHTML([null, null, null])) + '</div></div>' +
          '<div class="pair"><div class="seat"><span class="cap">' + short(themAddr) + (v.toAct === them2 ? ' · TO ACT' : '') + '</span><div class="cards">' + handHTML(v.theirs) + '</div>' +
            '<span class="cap" id="htbest">' + (v.theirBest ? v.theirBest.name : '') + '</span></div>' +
          '<div class="seat"><span class="cap locked">YOU' + (v.toAct === mine ? ' · TO ACT' : '') + '</span><div class="cards">' + handHTML(v.mine) + '</div>' +
            '<span class="cap" id="hmbest">' + (v.best ? v.best.name : '') + '</span></div></div></div>' +
          '<div class="unit"><span class="k">BETS IN CRYSTALS · HAND OPENED BY ' + (v.first === mine ? 'YOU' : 'THEM') + '</span><span class="k">PAID ' + v.paid[mine] + ' OF ' + v.hold + ' HELD</span></div>' +
          (v.legal.length ? '<div class="acts2">' + v.legal.map(a => btn({ type: a }, L[a], a === 'fold' || a === 'raise' || a === 'bet')).join('') + '</div>' : '') +
          (over ? '<div class="result' + (res === mine ? ' win' : '') + '" id="tres">' + verdict + ' <span class="need">· ' + (v.folded ? (v.folded === mine ? 'YOU FOLDED' : 'THEY FOLDED') : (v.best ? v.best.name : '') + ' V ' + (v.theirBest ? v.theirBest.name : '')) + '</span></div>' : '');
      } else if (v.game === 'fof') {
        const grid = (cells, click, hits) => '<div class="gridn" style="grid-template-columns:repeat(' + v.w + ',minmax(0,1fr))">' + cells.map((k, i) =>
          '<button class="cell' + (k ? ' ' + k : '') + (hits && hits.includes(i) ? ' fiend' : '') + '" type="button"' + (click && !k && v.legal.length ? ' data-act=\'' + JSON.stringify({ type: 'probe', cell: i }) + '\'' : ' disabled') + '>' +
            (k === 'friend' ? 'F' : k === 'fiend' ? 'X' : k === 'empty' ? '·' : '') + '</button>').join('') + '</div>';
        arena = '<div class="fof"><span class="lbl">THEIR GROUND · ' + (v.turn === mine ? 'YOUR TURN' : over ? 'OVER' : 'THEIR TURN') + '</span>' + grid(v.theirs, true) +
          '<div class="tally"><div><span class="k">THEIR FRIENDS</span><span class="v"><b>' + v.found + '</b> / ' + v.friends + '</span></div><div><span class="k">YOURS FOUND</span><span class="v"><b>' + v.lost + '</b> / ' + v.friends + '</span></div></div></div>' +
          (over ? '<div class="result' + (res === mine ? ' win' : '') + '" id="tres">' + verdict + '</div>' : '');
      }
    }
    const credit = d.credits ? d.credits[mine] - (d.hold ? d.hold[mine] : 0) : null;
    el.innerHTML =
      '<div class="mtop"><i class="dot"></i><span id="ttitle">' + GAME_NAME[d.game] + ' · #' + d.n + '</span><span class="sp"></span>' +
        '<span class="sample">' + (d.stake ? 'STAKE ' + d.stake + ' EACH' : 'FREE') + '</span><button class="ghost" type="button" id="tback">LOBBY</button></div>' +
      '<div class="body">' +
        '<div class="pot slim"><div class="k">POT</div><div class="n' + (v.pot ? ' live' : '') + '" id="tpot">' + (v.pot || 0) + '</div></div>' +
        '<div class="tseats"><div class="' + (v.yourMove && !over ? 'turn' : '') + '">YOU · <b>' + short(REAL.list.me.address) + '</b> · base ' + (mine === 'p1' ? d.from.base : d.to.base) + '</div>' +
          '<div class="' + (!v.yourMove && !over ? 'turn' : '') + '">THEM · <b>' + short(themAddr) + '</b> · base ' + (mine === 'p1' ? d.to.base : d.from.base) + '</div></div>' +
        (d.kind === 'sprung' ? '<div class="note2" id="tkind" data-kind="sprung">SPRUNG AT TERMINAL <b>' + d.terminal + '</b> BY A 1/1 DOOPIE' + (d.doopie != null ? ' <b>#' + d.doopie + '</b>' : '') + ' · ' +
          (mine === 'p1' ? 'YOUR DOOPIE · IT PROBES FIRST' : 'HELD BY <b>' + short(d.from.address) + '</b> · BASE ' + d.from.base + ' · IT PROBES FIRST') + '</div>'
          : d.kind === 'terminal' ? '<div class="note2" id="tkind" data-kind="terminal">PLAYED AT TERMINAL <b>' + d.terminal + '</b></div>' : '') +
        '<div class="arena" id="tarena">' + arena + '</div>' +
        (d.status === 'settled' ? '<div class="note2" id="tsettled">' + (credit >= 0 ? 'Settled into your base: <b>+' + credit + '</b> over what you put up.' : 'Settled: <b>' + credit + '</b> crystals.') +
          ((d.spilled || {})[mine] ? ' <b>' + d.spilled[mine] + '</b> did not fit your store and spilled next to your silo (next to your keep, if no silo stands).' : '') + '</div>' : '') +
        (over ? verifyHTML(v) : '<div class="verify">THE SERVER DREW THE WORD · COMMITMENT <b>' + String(v.commit || '').slice(0, 12) + '…</b> · SHOWN WHEN IT ENDS · MOVE WITHIN ' + until(d.deadline || 0) + '</div>') +
        '<div class="msg" id="tmsg">' + (REAL.msg || '') + '</div>' +
      '</div>';
    el.querySelectorAll('canvas[data-hand]').forEach(cv => paint(cv, HANDS[cv.dataset.hand]));
    if ($('rhm')) { paint($('rhm'), HANDS[(v.picks && v.picks[mine]) || 'rock']); paint($('rht'), HANDS[over ? v.picks[them2] : 'hidden']); }
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => realAct(JSON.parse(b.dataset.act)));
    $('tback').onclick = () => { REAL.open = null; REAL.msg = ''; paintReal(); };
  }
  detectReal();
  window.challenge = { S, P, H2H, GAMES, POTS, STAKES, settle, restart, potStats, rankOf, PLAYERS, TERMS: Duel.TERMS,
    bjTotal, score5, bestOf, cmpScore, rolls, deckFor, shuffled, FOF, STAND_ON,
    DEMO, applyDemo, readDemoChain, BET_UNITS, HOLDEM, betUnit, holdemMostX, holdemFirst };                                      // a handle for the checks
})();
</script>
</body>
</html>
